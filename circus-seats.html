<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>せきとりくん</title>
<script src="./msal-browser.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Meiryo UI','メイリオ',sans-serif;background:#f0f2f5;color:#333}

/* ── ログイン ── */
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;background:radial-gradient(ellipse at 60% 40%,#2a4a8a,#1a2f5a 50%,#0d1a33)}
.login-logo{font-size:4rem;margin-bottom:12px}
.login-title{color:#FFD700;font-size:1.9rem;font-weight:bold;margin-bottom:6px}
.login-sub{color:#8aa4d4;margin-bottom:40px;font-size:.95rem}
#btn-login{background:linear-gradient(135deg,#FFD700,#FFA500);color:#1a2f5a;border:none;
  padding:14px 48px;font-size:1.05rem;font-weight:bold;border-radius:50px;cursor:pointer;
  font-family:inherit;box-shadow:0 4px 24px #FFD70055;transition:transform .15s}
#btn-login:hover{transform:translateY(-2px)}
#login-err{color:#ff8888;margin-top:14px;font-size:.9rem;text-align:center}

/* ── アプリ ── */
#app-screen{display:none;min-height:100vh}
header{background:linear-gradient(90deg,#1a2f5a,#2a4a8a);color:white;padding:0 20px;height:54px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 12px rgba(0,0,0,0.4);position:sticky;top:0;z-index:100}
.hdr-left{display:flex;align-items:center;gap:10px}
.hdr-title{font-size:1rem;font-weight:bold;color:#FFD700}
.hdr-right{display:flex;align-items:center;gap:14px;font-size:.88rem;color:#8aa4d4}
#btn-logout{background:transparent;border:1px solid rgba(255,255,255,.25);color:white;
  padding:5px 16px;border-radius:20px;cursor:pointer;font-family:inherit;font-size:.82rem}
#btn-logout:hover{background:rgba(255,255,255,.12)}

/* ── タブ ── */
#tab-nav{background:white;border-bottom:2px solid #e8eaf0;display:flex;padding:0 20px}
.tab-btn{padding:12px 24px;border:none;background:transparent;font-family:inherit;
  font-size:.92rem;cursor:pointer;color:#666;border-bottom:3px solid transparent;
  margin-bottom:-2px;transition:color .15s,border-color .15s}
.tab-btn.active{color:#1a2f5a;border-bottom-color:#1a2f5a;font-weight:bold}

/* ── コントロール ── */
#controls{background:white;padding:12px 20px;border-bottom:1px solid #e0e4f0;
  display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ctrl-label{font-size:.82rem;font-weight:bold;color:#5a6a8a}
#show-select{padding:8px 14px;border:2px solid #2a4a8a;border-radius:8px;
  font-size:.95rem;font-family:inherit;color:#1a2f5a;min-width:230px;background:white;cursor:pointer}
#btn-refresh{background:#2a4a8a;color:white;border:none;padding:8px 18px;border-radius:8px;
  cursor:pointer;font-family:inherit;font-size:.88rem}
#btn-refresh:hover{background:#1a2f5a}
#stats{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.stat{padding:5px 14px;border-radius:16px;font-size:.82rem;font-weight:bold}
.st-ss {background:#FFF8DC;color:#8B6914;border:1px solid #FFE58A}
.st-s  {background:#F0FFF0;color:#2E7D32;border:1px solid #A5D6A7}
.st-box{background:#FFF3E0;color:#E65100;border:1px solid #FFCC80}
.st-tot{background:#1a2f5a;color:white}

/* ── 座席マップ ── */
#seat-map-panel{display:block}
#search-panel{display:none;padding:24px 20px}
#seat-map{padding:20px;overflow-x:auto}
.map-inner{min-width:0}
.stage-bar{background:linear-gradient(135deg,#FFD700,#FFA500);color:#3E1C00;
  text-align:center;padding:13px;font-size:1.1rem;font-weight:bold;border-radius:10px;
  margin-bottom:20px;letter-spacing:.15em;box-shadow:0 3px 12px rgba(255,180,0,.35)}
.section-title{display:flex;align-items:center;gap:8px;margin:18px 0 8px}
.section-title span{background:#1a2f5a;color:white;padding:5px 16px;border-radius:20px;
  font-size:.82rem;font-weight:bold}
.section-title hr{flex:1;border:none;border-top:1px solid #ddd}
.block-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.block{background:white;border:1px solid #e0e4f0;border-radius:10px;padding:10px;
  box-shadow:0 1px 6px rgba(0,0,0,.06)}
.block-name{font-size:.75rem;text-align:center;margin-bottom:7px;font-weight:bold}
.block-name.ktn-ss {color:#8B6914}
.block-name.ktn-s  {color:#2E7D32}
.block-name.ktn-box{color:#E65100}
.block-name.pg     {color:#6D28D9}
.seat-grid{display:grid;gap:3px}

/* ── 座席ボタン ── */
.seat{width:40px;height:40px;border-radius:5px;font-size:.65rem;display:flex;
  align-items:center;justify-content:center;text-align:center;overflow:hidden;
  line-height:1.2;padding:2px;cursor:pointer;font-family:inherit;
  transition:transform .12s,box-shadow .12s;word-break:break-all}
.seat:hover:not(.ng){transform:scale(1.18);z-index:10;position:relative;
  box-shadow:0 3px 10px rgba(0,0,0,.2)}
/* KTN空席 - 太枠 */
.seat.avail-ss {background:#FFFDE7;color:#8B6914;border:2px solid #F9A825}
.seat.avail-s  {background:#F1F8E9;color:#33691E;border:2px solid #7CB342}
.seat.avail-box{background:#FFF3E0;color:#BF360C;border:2px solid #FB8C00}
/* 販売済 */
.seat.sold {background:#E8F5E9;color:#1B5E20;font-size:.58rem;border:2px solid #66BB6A}
/* PG空席 */
.seat.pg-avail{background:#EDE9FE;color:#5B21B6;border:1px dashed #7C3AED}
/* PG配分済 */
.seat.pg-set  {background:#DDD6FE;color:#4C1D95;border:1px solid #7C3AED;font-size:.6rem}
/* 取消選択中 */
.seat.sel-cancel{background:#FFEBEE!important;color:#C62828!important;border:2px solid #EF5350!important;font-weight:bold;transform:scale(1.1);z-index:10;position:relative}
/* PG個別販売済 */
.seat.pg-sold {background:#C4B5FD;color:#2D1B69;border:1px solid #5B21B6;font-size:.58rem}
/* 複数選択 */
.seat.selected{background:#DBEAFE!important;color:#1D4ED8!important;
  border:2px solid #1D4ED8!important;font-weight:bold;transform:scale(1.1);
  z-index:10;position:relative}

/* ── 複数選択バー ── */
#sel-bar{display:none;position:fixed;bottom:0;left:0;right:0;
  background:linear-gradient(135deg,#1a2f5a,#2a4a8a);color:white;
  padding:14px 24px;align-items:center;justify-content:space-between;
  box-shadow:0 -4px 20px rgba(0,0,0,.3);z-index:200}
#sel-bar.open{display:flex}
body.sel-open #seat-map{padding-bottom:90px}
#sel-bar-info{font-size:1rem;font-weight:bold}
#sel-bar-info-wrap{min-width:0;overflow:hidden}
#sel-bar-seats{font-size:.8rem;color:#8aa4d4;margin-top:3px;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sel-bar-btns{display:flex;gap:10px;flex-shrink:0}
#btn-sel-ok{background:#FFD700;color:#1a2f5a;border:none;padding:10px 24px;
  border-radius:8px;font-size:.95rem;font-weight:bold;cursor:pointer;font-family:inherit}
#btn-sel-ok:hover{background:#FFC000}
#btn-sel-clr{background:transparent;color:white;border:1px solid rgba(255,255,255,.4);
  padding:10px 18px;border-radius:8px;font-size:.9rem;cursor:pointer;font-family:inherit}

/* ── モーダル ── */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,20,50,.65);
  z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
#modal-overlay.open{display:flex}
#modal{background:white;border-radius:16px;padding:28px;width:440px;max-width:95vw;
  box-shadow:0 12px 48px rgba(0,0,0,.35);animation:mIn .18s ease}
@keyframes mIn{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1;transform:none}}
#modal h2{color:#1a2f5a;margin-bottom:4px;font-size:1.1rem}
.modal-info{color:#666;font-size:.83rem;margin-bottom:18px;padding-bottom:14px;
  border-bottom:1px solid #eee}
.pg-note{background:#EDE9FE;border:1px solid #C4B5FD;border-radius:8px;
  padding:10px;margin-bottom:14px;font-size:.83rem;color:#5B21B6}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.82rem;font-weight:bold;color:#444;margin-bottom:5px}
.form-group input,.form-group select{width:100%;padding:10px 13px;border:2px solid #e0e0e0;
  border-radius:8px;font-size:.95rem;font-family:inherit;transition:border-color .15s}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#2a4a8a}
.hint{font-size:.73rem;color:#999;margin-top:3px}
.sold-card{background:#F1F8FF;border:1px solid #BBDEFB;border-radius:10px;padding:14px;margin-bottom:14px}
.sold-card p{font-size:.88rem;color:#1565C0;margin-bottom:6px}
.sold-card p:last-child{margin-bottom:0}
.pg-card{background:#F5F3FF;border:1px solid #C4B5FD;border-radius:10px;padding:14px;margin-bottom:14px}
.pg-card p{font-size:.88rem;color:#5B21B6;margin-bottom:6px}
.modal-btns{display:flex;gap:10px;margin-top:18px}
#btn-save{flex:1;background:linear-gradient(135deg,#1a2f5a,#2a4a8a);color:white;border:none;
  padding:12px;border-radius:8px;font-size:.95rem;cursor:pointer;font-family:inherit;
  font-weight:bold;transition:opacity .15s}
#btn-save:disabled{background:#ccc;cursor:default}
#btn-cancel,#btn-close{flex:1;background:#f5f5f5;color:#444;border:1px solid #ddd;
  padding:12px;border-radius:8px;font-size:.95rem;cursor:pointer;font-family:inherit}
#btn-cancel:hover,#btn-close:hover{background:#eee}
#btn-delete{width:100%;background:#FFF5F5;color:#C62828;border:1px solid #FFCDD2;
  padding:10px;border-radius:8px;font-size:.88rem;cursor:pointer;font-family:inherit;margin-bottom:10px}
#btn-delete:hover{background:#FFEBEE}
.err{color:#C62828;font-size:.82rem;margin-top:8px;min-height:18px}

/* ── 検索パネル ── */
.search-box{background:white;border-radius:12px;padding:20px;box-shadow:0 1px 6px rgba(0,0,0,.08);
  margin-bottom:20px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.search-box .form-group{margin:0;flex:1;min-width:180px}
#btn-search{background:#1a2f5a;color:white;border:none;padding:10px 28px;
  border-radius:8px;cursor:pointer;font-family:inherit;font-size:.95rem;white-space:nowrap}
#btn-search:hover{background:#2a4a8a}
.s-results{background:white;border-radius:12px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.s-results table{width:100%;border-collapse:collapse}
.s-results th{background:#1a2f5a;color:white;padding:10px 14px;font-size:.82rem;text-align:left}
.s-results td{padding:10px 14px;font-size:.88rem;border-bottom:1px solid #f0f0f0}
.s-results tr:last-child td{border-bottom:none}
.s-results tr:hover td{background:#f8f9ff}
.no-r{padding:32px;text-align:center;color:#aaa;font-size:.9rem}
.bdg-ss{background:#FFF8DC;color:#8B6914;padding:2px 8px;border-radius:10px;font-size:.78rem}
.bdg-s {background:#F0FFF0;color:#2E7D32;padding:2px 8px;border-radius:10px;font-size:.78rem}
.bdg-bx{background:#FFF3E0;color:#E65100;padding:2px 8px;border-radius:10px;font-size:.78rem}
.bdg-pg{background:#EDE9FE;color:#5B21B6;padding:2px 8px;border-radius:10px;font-size:.78rem}

/* ── ローディング ── */
#loading{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(15,25,60,.9);color:white;padding:18px 36px;border-radius:12px;
  font-size:.95rem;z-index:1000;box-shadow:0 4px 24px rgba(0,0,0,.4)}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-logo">🎪</div>
  <div class="login-title">せきとりくん（テスト版）</div>
  <div class="login-sub">Ver.0730.1000</div>
  <button id="btn-login" onclick="login()">ログイン</button>
  <div id="login-err"></div>
</div>

<div id="app-screen">
  <header>
    <div class="hdr-left">
      <span>🎭</span>
      <span class="hdr-title">せきとりくん（最終評価版 R4）Ver.0730.1000</span>
    </div>
    <div class="hdr-right">
      <span id="user-name"></span>
      <button id="btn-logout" onclick="logout()">ログアウト</button>
    </div>
  </header>

  <div id="tab-nav">
    <button class="tab-btn active" onclick="switchTab('map')">🗺 座席マップ</button>
    <button class="tab-btn" onclick="switchTab('search')">🔍 検索</button>
  </div>

  <div id="controls">
    <span class="ctrl-label">公演：</span>
    <select id="show-select" onchange="onShowChange()">
      <option value="">-- 公演を選択してください --</option>
    </select>
    <button id="btn-refresh" onclick="loadSeatData()">🔄 更新</button>
    <button id="btn-cancel-mode" onclick="toggleCancelMode()" style="background:#f5f5f5;color:#444;border:1px solid #ddd;padding:8px 18px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:.88rem;transition:all .2s">🗑 取消モード OFF</button>
    <div id="stats">
      <span class="stat st-ss"  id="stat-ss">SS: ―</span>
      <span class="stat st-s"   id="stat-s" >S: ―</span>
      <span class="stat st-box" id="stat-box">BOX: ―</span>
      <span class="stat st-tot" id="stat-tot">KTN販売: ―</span>
    </div>
  </div>

  <div id="seat-map-panel">
    <div id="seat-map">
      <div class="map-inner" id="map-inner">
        <p style="color:#aaa;padding:40px;text-align:center">公演を選択してください</p>
      </div>
    </div>
  </div>

  <div id="search-panel">
    <div class="search-box">
      <div class="form-group">
        <label>購入者名で検索</label>
        <input type="text" id="q-name" placeholder="例：山田" onkeydown="if(event.key==='Enter')doSearch()">
      </div>
      <div class="form-group">
        <label>電話番号で検索</label>
        <input type="tel" id="q-tel" placeholder="例：090-1234" onkeydown="if(event.key==='Enter')doSearch()">
      </div>
      <button id="btn-search" onclick="doSearch()">検索</button>
    </div>
    <div id="search-results-wrap"></div>
  </div>
</div>

<!-- 複数選択バー（KTNのみ） -->
<div id="sel-bar">
  <div id="sel-bar-info-wrap">
    <div id="sel-bar-info">0席選択中</div>
    <div id="sel-bar-seats"></div>
  </div>
  <div class="sel-bar-btns">
    <button id="btn-sel-clr" onclick="clearSelection()">✕ 解除</button>
    <button id="btn-sel-cancel-all" onclick="cancelSelected()" style="display:none;background:#FFF0F0;color:#C62828;border:1px solid #FFAAAA;padding:10px 18px;border-radius:8px;font-size:.9rem;cursor:pointer;font-family:inherit">🗑 取り消す</button>
    <button id="btn-sel-pg-return" onclick="bulkPgReturn()" style="display:none;background:#EFF6FF;color:#1D4ED8;border:1px solid #93C5FD;padding:10px 18px;border-radius:8px;font-size:.9rem;cursor:pointer;font-family:inherit">📦 返却済みにする</button>
    <button id="btn-sel-ok"  onclick="openMultiModal()">登録する →</button>
  </div>
</div>

<!-- モーダル -->
<div id="modal-overlay">
  <div id="modal">
    <h2 id="modal-title">座席予約</h2>
    <div class="modal-info" id="modal-info"></div>
    <div id="form-new">
      <div class="pg-note" id="pg-note" style="display:none">
        🎫 PG席です。内容を確認・変更して保存してください
      </div>
      <div class="form-group">
        <label>購入者名 <span style="color:red">*</span></label>
        <input type="text" id="inp-name" placeholder="かなやたろう" autocomplete="off">
      </div>
      <div class="form-group">
        <label>電話番号 <span style="color:red">*</span></label>
        <input type="tel" id="inp-tel" placeholder="09012345678" autocomplete="off">
        <div class="hint">ハイフンなし半角数字</div>
      </div>
      <div class="form-group">
        <label>受付 <span style="color:red">*</span></label>
        <select id="sel-staff"><option value="">-- 選択 --</option></select>
      </div>
      <div class="form-group">
        <label>メモ（任意）</label>
        <textarea id="inp-memo" placeholder="備考・連絡事項など" rows="2"
          style="width:100%;padding:10px 13px;border:2px solid #e0e0e0;border-radius:8px;
          font-size:.9rem;font-family:inherit;resize:vertical;transition:border-color .15s"
          onfocus="this.style.borderColor='#2a4a8a'" onblur="this.style.borderColor='#e0e0e0'"></textarea>
      </div>
      <div class="err" id="err-msg"></div>
      <div class="modal-btns">
        <button id="btn-save" onclick="saveSeat()">✓ 登録する</button>
        <button id="btn-cancel" onclick="closeModal()">キャンセル</button>
      </div>
    </div>
    <div id="form-sold" style="display:none">
      <div id="sold-card-wrap"></div>
      <button id="btn-add-cancel" onclick="toggleCancelFromModal()"
        style="width:100%;padding:10px;border-radius:8px;font-size:.88rem;cursor:pointer;font-family:inherit;margin-bottom:8px;border:1px solid #FFCDD2;background:#FFF5F5;color:#C62828">
        🗑 取消対象に追加
      </button>
      <button id="btn-delete" onclick="deleteSeat()">🗑 この1席だけ今すぐ取り消す</button>
      <div class="modal-btns">
        <button id="btn-close" onclick="closeModal()">閉じる</button>
      </div>
    </div>
  </div>
</div>

<div id="loading">読み込み中...</div>

<script>
// ─────────────────────────────────────────────
//  設定（ここを変更してください）
// ─────────────────────────────────────────────
const CLIENT_ID = '83a913fd-37c9-4b45-993a-c8777f55c0b2';
const TENANT_ID = '0bd1b308-c26d-49bb-acbd-86dd168984f6';
const SP_HOST   = 'ktno365.sharepoint.com';
const SP_SITE   = 'circus2026';
const LIST_NAME = '座席販売管理';

// PG席のデフォルト値（変更可能）
const PG_CONFIG = {
  buyerName: 'PG',
  tel:       '0123',
  staff:     'システム',
};

// ─────────────────────────────────────────────
//  内部定数
// ─────────────────────────────────────────────
const SITE_PATH = SP_HOST + ':/sites/' + SP_SITE + ':';
const LIST_URL  = 'https://graph.microsoft.com/v1.0/sites/' + SITE_PATH + '/lists/' + encodeURIComponent(LIST_NAME);
const msalCfg = {
  auth:{
    clientId: CLIENT_ID,
    authority:'https://login.microsoftonline.com/' + TENANT_ID,
    redirectUri: window.location.origin + window.location.pathname,
  },
  cache:{cacheLocation:'sessionStorage'}
};
const SCOPES = ['https://graph.microsoft.com/Sites.ReadWrite.All'];

  {id:'2026-11-21-1530',label:'11/21(土) 15:30'},
  {id:'2026-11-22-1000',label:'11/22(日) 10:00'},
  {id:'2026-11-22-1300',label:'11/22(日) 13:00'},
  {id:'2026-11-22-1530',label:'11/22(日) 15:30'},
  {id:'2026-11-23-1000',label:'11/23(月) 10:00'},
  {id:'2026-11-23-1300',label:'11/23(月) 13:00'},
  {id:'2026-11-23-1530',label:'11/23(月) 15:30'},
  {id:'2026-11-24-1100',label:'11/24(火) 11:00'},
  {id:'2026-11-24-1400',label:'11/24(火) 14:00'},
  {id:'2026-11-26-1100',label:'11/26(木) 11:00'},
  {id:'2026-11-26-1400',label:'11/26(木) 14:00'},
  {id:'2026-11-27-1400',label:'11/27(金) 14:00'},
  {id:'2026-11-27-1830',label:'11/27(金) 18:30'},
  {id:'2026-11-28-1000',label:'11/28(土) 10:00'},
  {id:'2026-11-28-1300',label:'11/28(土) 13:00'},

// SharePointの更新日時(UTC ISO文字列)を日本時間の表示用文字列に変換
function toJST(iso){
  if(!iso) return '';
  try{
    var d = new Date(iso);
    if(isNaN(d.getTime())) return '';
    return d.toLocaleString('ja-JP',{
      timeZone:'Asia/Tokyo',
      year:'numeric',month:'2-digit',day:'2-digit',
      hour:'2-digit',minute:'2-digit'
    })+' (JST)';
  }catch(e){ return ''; }
}

function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/[&<>"']/g, function(c){ return _escMap[c]; });
}

async function getMsal(){
  if(msalInstance) return msalInstance;
  var waited = 0;
  while(typeof msal === 'undefined' && waited < 60){
    await new Promise(function(r){setTimeout(r,100);});
    waited++;
  }
  if(typeof msal === 'undefined'){
    throw new Error('MSALライブラリが読み込めません。ページを更新してください。');
  }
  msalInstance = new msal.PublicClientApplication(msalCfg);
  await msalInstance.initialize();
  return msalInstance;
}

async function login(){
  var errEl = document.getElementById('login-err');
  errEl.textContent = 'ログイン処理中...';
  try{
    var inst = await getMsal();
    var r = await inst.loginPopup({scopes:SCOPES});
    account = r.account;
    errEl.textContent = '';
    onLoggedIn();
  }catch(e){
    if(e.message && e.message.includes('user_cancelled')){
      errEl.textContent = '';
    }else if(e.message && e.message.includes('popup_window_error')){
      errEl.textContent = 'ポップアップがブロックされました。ブラウザのアドレスバーのポップアップ許可をクリックして再試行してください。';
    }else{
      errEl.textContent = 'エラー: ' + (e.message || String(e));
    }
  }
}

function logout(){
  if(msalInstance) msalInstance.logoutPopup({account:account});
}

async function getToken(){
  var inst = await getMsal();
  try{
    return (await inst.acquireTokenSilent({scopes:SCOPES,account:account})).accessToken;
  }catch(e){
    return (await inst.acquireTokenPopup({scopes:SCOPES})).accessToken;
  }
}

async function graph(url,method,body){
  method = method||'GET'; body = body||null;
  var tok = await getToken();
  var opt = {
    method:method,
    headers:{
      'Authorization':'Bearer '+tok,
      'Content-Type':'application/json',
      'Prefer':'HonorNonIndexedQueriesWarningMayFailRandomly'
    }
  };
  if(body) opt.body = JSON.stringify(body);
  var res = await fetch(url,opt);
  if(!res.ok){
    var t = await res.text();
    throw new Error('GraphAPI '+res.status+': '+t);
  }
  if(method==='DELETE') return null;
  return res.json();
}

async function loadStaff(){
  var res = await graph(LIST_URL+'/columns');

async function loadSeatData(){

// 座席ボタン1つ分を生成（renderBoxSection・renderNamedRowSection共通）
function buildSeatButton(blk, num){
    var sid = getSeatId(blk,num);
    var btn = document.createElement('button');
    btn.dataset.sid = sid;
    btn.dataset.num = String(num);

    // 選択状態を確認
    var selInfo = selectedSeats.get(sid);
    if(selInfo){
      // 選択中（登録待ち or 取消待ち）
      btn.className = selInfo.mode==='cancel' ? 'seat sel-cancel' : 'seat selected';
      btn.textContent = selInfo.mode==='cancel' ? '✕' : '✓';
      (function(b_,num_,sid_,btn_){
        btn_.onclick = function(){toggleAny(b_,num_,sid_,btn_);};
      })(blk,num,sid,btn);
    } else if(blk.role==='ktn'){
      if(soldMap[sid] && soldMap[sid].name!=='キャンセル済'){
        btn.className = 'seat sold';
        btn.textContent = soldMap[sid].name;
        btn.title = sid+': '+soldMap[sid].name;
        (function(b_,num_,sid_,btn_){
          btn_.onclick = function(){toggleAny(b_,num_,sid_,btn_);};
        })(blk,num,sid,btn);
      } else {
        btn.className = 'seat avail-'+blk.type;
        btn.textContent = num;
        btn.title = sid+'（空席）';
        (function(b_,num_,sid_,btn_){
          btn_.onclick = function(){toggleAny(b_,num_,sid_,btn_);};
        })(blk,num,sid,btn);
      }
    } else {
      // PG席：状態判定
      var pgInfo    = soldMap[sid];
      var isPgAlloc  = !pgInfo || pgInfo.name===PG_CONFIG.buyerName;
      var isReturned = pgInfo && (pgInfo.name==='返却済' || pgInfo.name==='キャンセル済');

      if(isPgAlloc){
        // PG配分済（紫・予約済み見た目）＋座席番号を下段に表示
        btn.className = 'seat pg-set';
        btn.innerHTML = stackedSeatLabel('PG', num);
        btn.title = sid+'（PG配分済）';
        (function(b_,num_,sid_,btn_){
          btn_.onclick = function(){
            if(cancelMode){
              // 取消モード：PG配分済みを返却済みリストへ
              if(selectedSeats.has(sid_)){
                selectedSeats.delete(sid_);
                btn_.className='seat pg-set'; btn_.innerHTML=stackedSeatLabel('PG', num_);
              } else {
                selectedSeats.set(sid_,{blk:b_,num:num_,sid:sid_,mode:'pg-return'});
                btn_.className='seat sel-cancel'; btn_.textContent='✕';
              }
              updateSelBar();
            } else {
              openPgAllocModal(b_,num_,sid_);
            }
          };
        })(blk,num,sid,btn);
      } else if(isReturned){
        // 返却済→自社販売可（KTN空席と同じ見た目）
        btn.className = 'seat avail-'+blk.type;
        btn.textContent = num;
        btn.title = sid+'（返却済・自社販売可）';
        (function(b_,num_,sid_,btn_){
          btn_.onclick = function(){toggleAny(b_,num_,sid_,btn_);};
        })(blk,num,sid,btn);
      } else {
        // 個人購入済（緑、KTN統計外）
        btn.className = 'seat sold';
        btn.textContent = pgInfo.name;
        btn.title = sid+': '+pgInfo.name+'（PG席・個人購入）';
        (function(b_,num_,sid_,btn_){
          btn_.onclick = function(){toggleAny(b_,num_,sid_,btn_);};
        })(blk,num,sid,btn);
      }
    }
    return btn;
}

// ─────────────────────────────────────────────
//  SS席・S席：印刷用座席マップに合わせた物理レイアウトで描画（共通関数）
//  rows: [ [{blk:'お',seats:[...]}, {blk:'え',seats:[...]}, ...], ... ]
//  各blk名はBLOCKS配列のpfxと対応させて役割（KTN/PG）や座席IDを引く
//  ブロックごとに1本の「縦の列」にして、その中で段を積み重ねる（PDFと同じ構造）
// ─────────────────────────────────────────────
function findBlockByPfx(pfx){
  for(var i=0;i<BLOCKS.length;i++){ if(BLOCKS[i].pfx===pfx) return BLOCKS[i]; }
  return null;
}
// rows（段ごと）のデータを、ブロックごとの列データに組み替える
function transposeToColumns(rows){
  var order = [];
  var map = {};
  for(var r=0;r<rows.length;r++){
    for(var g=0;g<rows[r].length;g++){
      var grp = rows[r][g];
      if(!map[grp.blk]){ map[grp.blk]=[]; order.push(grp.blk); }
      map[grp.blk].push(grp.seats);
    }
  }
  return order.map(function(name){ return {blk:name, rowSeats:map[name]}; });
}
function renderNamedRowSection(rows){
  var columns = transposeToColumns(rows);

  var outer = document.createElement('div');
  outer.style.background='white';
  outer.style.borderRadius='10px';
  outer.style.padding='16px 12px';
  outer.style.boxShadow='0 1px 6px rgba(0,0,0,.06)';
  outer.style.overflowX='auto';

  var wrap = document.createElement('div');
  wrap.style.display='flex';
  wrap.style.gap='22px';
  wrap.style.justifyContent='center';
  wrap.style.width='max-content';
  wrap.style.margin='0 auto';

  columns.forEach(function(col){
    var blkInfo = findBlockByPfx(col.blk);
    var colDiv = document.createElement('div');
    colDiv.style.display='flex';
    colDiv.style.flexDirection='column';
    colDiv.style.alignItems='center';
    colDiv.style.gap='6px';

    var lbl = document.createElement('div');
    lbl.textContent = col.blk;
    lbl.style.fontWeight = 'bold';
    lbl.style.fontSize = '1rem';
    lbl.style.marginBottom = '2px';
    lbl.style.color = blkInfo && blkInfo.role==='pg' ? '#6D28D9' : '#8B6914';
    colDiv.appendChild(lbl);

    col.rowSeats.forEach(function(seats){
      var rowDiv = document.createElement('div');
      rowDiv.style.display='flex';
      rowDiv.style.gap='3px';
      for(var i=0;i<seats.length;i++){
        rowDiv.appendChild(buildSeatButton(blkInfo, seats[i]));
      }
      colDiv.appendChild(rowDiv);
    });

    wrap.appendChild(colDiv);
  });

  outer.appendChild(wrap);
  return outer;
}

function updateStats(){
  var ss=0,sS=0,box=0,ssSold=0,sSold=0,boxSold=0,pgIndSold=0;
  for(var k=0;k<BLOCKS.length;k++){
    var blk=BLOCKS[k];
    for(var i=0;i<blk.seats.length;i++){
      var sid=getSeatId(blk,blk.seats[i]);
      var info=soldMap[sid];
      if(blk.role==='ktn'){
        // KTN枠のみカウント（返却済・キャンセル済は空席扱い）
        if(blk.id.startsWith('SS')){ss++;if(info&&info.name!=='返却済'&&info.name!=='キャンセル済')ssSold++;}
        else if(blk.id.startsWith('S_')){sS++;if(info&&info.name!=='返却済'&&info.name!=='キャンセル済')sSold++;}
        else{box++;if(info&&info.name!=='返却済'&&info.name!=='キャンセル済')boxSold++;}
      } else {
        // PG席：個人購入済みのみ別カウント（返却済・キャンセル済・PG配分除外）
        if(info&&info.name!=='返却済'&&info.name!=='キャンセル済'&&info.name!==PG_CONFIG.buyerName) pgIndSold++;
      }
    }
  }
  document.getElementById('stat-ss') .textContent='SS: '+ssSold+'/'+ss;
  document.getElementById('stat-s')  .textContent='S: '+sSold+'/'+sS;
  document.getElementById('stat-box').textContent='BOX: '+boxSold+'/'+box;
  document.getElementById('stat-tot').textContent='KTN: '+(ssSold+sSold+boxSold)+'/217'+(pgIndSold>0?' PG返却→販売:'+pgIndSold:'');
}

// ─────────────────────────────────────────────
//  複数選択（KTNのみ）
// ─────────────────────────────────────────────
function toggleAny(blk,num,sid,btn){
  if(selectedSeats.has(sid)){
    // 選択解除：renderBlockと同じ判定基準で元の表示に戻す
    selectedSeats.delete(sid);
    var info = soldMap[sid];
    if(blk.role==='pg'){
      var isPgAlloc2  = !info || info.name===PG_CONFIG.buyerName;
      var isReturned2 = info && (info.name==='返却済' || info.name==='キャンセル済');
      if(isPgAlloc2){
        btn.className='seat pg-set'; btn.innerHTML=stackedSeatLabel('PG', num);
      } else if(isReturned2){
        btn.className='seat avail-'+blk.type; btn.textContent=num;
      } else {
        btn.className='seat sold'; btn.textContent=info.name;
      }
    } else {
      if(info && info.name!=='キャンセル済'){
        btn.className='seat sold'; btn.textContent=info.name;
      } else {
        btn.className='seat avail-'+blk.type; btn.textContent=num;
      }
    }
    updateSelBar();
    return;
  }
  // 返却済・キャンセル済の席は空席として扱う
  var isReturnedPg = soldMap[sid] && (soldMap[sid].name==='返却済' || soldMap[sid].name==='キャンセル済');
  // 取消モードON + 販売済み → 直接取消選択
  if(cancelMode && soldMap[sid] && !isReturnedPg){
    var hasReg2=false;
    selectedSeats.forEach(function(v){if(v.mode==='reg') hasReg2=true;});
    if(hasReg2){alert('登録待ちの席と取消待ちの席を同時に選択できません。 一度「解除」してからやり直してください。');return;}
    selectedSeats.set(sid,{blk:blk,num:num,sid:sid,mode:'cancel'});
    btn.className='seat sel-cancel'; btn.textContent='✕';
    updateSelBar(); return;
  }
  // 販売済み（返却済以外）はまず情報モーダル表示
  if(soldMap[sid] && !isReturnedPg){
    openSoldModalWithAction(blk,num,sid);
    return;
  }
  // 空席は登録選択
  var hasCancel=false;
  selectedSeats.forEach(function(v){if(v.mode==='cancel') hasCancel=true;});
  if(hasCancel){
    alert('取消待ちの席と登録待ちの席を同時に選択できません。 一度「解除」してからやり直してください。');
    return;
  }
  selectedSeats.set(sid,{blk:blk,num:num,sid:sid,mode:'reg'});
  btn.className = 'seat selected';
  btn.textContent = '✓';
  updateSelBar();
}

function toggleCancelMode(){

    btn.style.background='#C62828'; btn.style.color='white';
    btn.style.border='1px solid #C62828';

    // 登録待ちがあればクリア
    var hasReg=false;
    selectedSeats.forEach(function(v){if(v.mode==='reg') hasReg=true;});
    if(hasReg){selectedSeats.clear();updateSelBar();if(showId)renderMap();}
  } else {
    btn.style.background='#f5f5f5'; btn.style.color='#444';
    btn.style.border='1px solid #ddd';
    btn.textContent='🗑 取消モード OFF';
  }
}

function updateSelBar(){
  var bar = document.getElementById('sel-bar');
  var n = selectedSeats.size;
  if(n===0){
    bar.classList.remove('open');
    document.body.classList.remove('sel-open');
    return;
  }
  bar.classList.add('open');
  document.body.classList.add('sel-open');
  var hasReg=false, hasCancel=false, hasPgReturn=false;
  var regN=0, cancelN=0, pgReturnN=0;
  var ids=[];
  selectedSeats.forEach(function(v){
    ids.push(v.sid);
    if(v.mode==='cancel'){hasCancel=true;cancelN++;}
    else if(v.mode==='pg-return'){hasPgReturn=true;pgReturnN++;}
    else{hasReg=true;regN++;}
  });
  var label = '';
  if(hasReg&&!hasCancel&&!hasPgReturn) label=regN+'席選択中（登録待ち）';
  else if(hasCancel&&!hasReg&&!hasPgReturn) label=cancelN+'席選択中（取消待ち）';
  else if(hasPgReturn&&!hasReg&&!hasCancel) label=pgReturnN+'席選択中（PG返却待ち）';
  else label=n+'席選択中';
  document.getElementById('sel-bar-info').textContent = label;
  document.getElementById('sel-bar-seats').textContent = ids.join('、');
  document.getElementById('btn-sel-ok').style.display = hasReg?'inline-block':'none';
  document.getElementById('btn-sel-cancel-all').style.display = hasCancel?'inline-block':'none';
  var pgRetBtn=document.getElementById('btn-sel-pg-return');
  if(pgRetBtn) pgRetBtn.style.display = hasPgReturn?'inline-block':'none';
}

function clearSelection(){
  selectedSeats.clear();
  document.body.classList.remove('sel-open');
  updateSelBar();
  if(showId) renderMap();
}

  addCancelBtn.style.color='#1D4ED8';
  addCancelBtn.style.border='2px solid #93C5FD';
  addCancelBtn.textContent='📦 返却済みにする（自社販売枠に変更）';
  addCancelBtn.onclick=function(){markAsReturned();};
  // 「今すぐ取り消す」は非表示
  document.getElementById('btn-delete').style.display='none';
  document.getElementById('form-new').style.display='none';
  document.getElementById('form-sold').style.display='block';
  document.getElementById('modal-overlay').classList.add('open');
}

async function markAsReturned(){
  if(!selSeat) return;
  showLoad('返却済みに変更中...');
  try{
    var READONLY=['Author','Editor','Created','Modified','ID','GUID','ContentType'];
    function setR(f,k,v){var n=colMap[k]||k;if(READONLY.indexOf(n)<0)f[n]=v;}
    var f={Title:showId+'-'+selSeat.sid};
    setR(f,'公演ID',showId); setR(f,'座席ID',selSeat.sid);
    setR(f,'購入者名','返却済'); setR(f,'電話番号','');
    setR(f,'席種',getSeatType(selSeat.blk)); setR(f,'受付','システム');
    if(soldMap[selSeat.sid]){
      await graph(LIST_URL+'/items/'+soldMap[selSeat.sid].itemId,'PATCH',{fields:f});
    } else {
      await graph(LIST_URL+'/items','POST',{fields:f});
    }
    closeModal(); await loadSeatData();
  }catch(e){alert('エラー: '+e.message);}
  finally{hideLoad();}
}

// ─────────────────────────────────────────────
//  モーダル（販売済み確認＋取消追加）
// ─────────────────────────────────────────────
function openSoldModalWithAction(blk,num,sid){
  var isPg = blk.role==='pg';
  selSeat = {blk:blk,num:num,sid:sid,isPg:isPg};
  var info = soldMap[sid];
  var show = null;
  for(var i=0;i<SHOWS.length;i++){if(SHOWS[i].id===showId){show=SHOWS[i];break;}}
  document.getElementById('modal-title').textContent = isPg?'PG席情報':'予約情報';
  document.getElementById('modal-info').textContent = (show?show.label:'')+'｜'+sid+(isPg?' [PG席]':'');
  var memoVal = (info && info.memo) ? info.memo : '';
  var timeVal = toJST(info && info.modified);
  var cardClass = isPg?'pg-card':'sold-card';

  // 取消選択済みかチェック
  var alreadyInCancel = selectedSeats.has(sid);
  // btn-deleteとbtn-add-cancelをリセット
  document.getElementById('btn-delete').style.display='block';
  var addCancelBtn2=document.getElementById('btn-add-cancel');
  addCancelBtn2.style.display='block';
  addCancelBtn2.style.background='#FFF5F5';
  addCancelBtn2.style.color='#C62828';
  addCancelBtn2.style.border='1px solid #FFCDD2';
  addCancelBtn2.style.fontWeight='normal';
  addCancelBtn2.onclick=function(){toggleCancelFromModal();};

  document.getElementById('sold-card-wrap').innerHTML =
    '<div class="'+cardClass+'">'
    +'<p><strong>購入者：</strong>'+escapeHtml(info.name)+'</p>'
    +'<p><strong>電話番号：</strong>'+escapeHtml(info.tel)+'</p>'
    +'<p><strong>受付：</strong>'+escapeHtml(info.staff)+'</p>'
    +(memoVal?'<p><strong>メモ：</strong>'+escapeHtml(memoVal)+'</p>':'')
    +(timeVal?'<p style="font-size:.78rem;color:#888;margin-top:8px;padding-top:8px;border-top:1px dashed rgba(0,0,0,.1)"><strong>登録・取消日時：</strong>'+escapeHtml(timeVal)+'</p>':'')
    +'</div>';

  // 「取消対象に追加」ボタン
  var addCancelBtn = document.getElementById('btn-add-cancel');
  if(alreadyInCancel){
    addCancelBtn.textContent = '✓ 取消対象から外す';
    addCancelBtn.style.background = '#E8F5E9';
    addCancelBtn.style.color = '#2E7D32';
    addCancelBtn.style.borderColor = '#A5D6A7';
  } else {
    addCancelBtn.textContent = '🗑 取消対象に追加';
    addCancelBtn.style.background = '#FFF5F5';
    addCancelBtn.style.color = '#C62828';
    addCancelBtn.style.borderColor = '#FFCDD2';
  }

  document.getElementById('form-new').style.display='none';
  document.getElementById('form-sold').style.display='block';
  document.getElementById('modal-overlay').classList.add('open');
}

function openSoldModal(blk,num,sid,isPg){
  openSoldModalWithAction(blk,num,sid);
}

// 取消対象への追加/除外
function toggleCancelFromModal(){
  if(!selSeat) return;
  var sid = selSeat.sid;
  var blk = selSeat.blk;
  if(selectedSeats.has(sid)){
    // 取消対象から外す
    selectedSeats.delete(sid);
    updateSelBar();
    closeModal();
    renderMap();
  } else {
    // 取消対象に追加
    var hasReg=false;
    selectedSeats.forEach(function(v){if(v.mode==='reg') hasReg=true;});
    if(hasReg){
      alert('登録待ちの席と取消待ちの席を同時に選択できません。 一度「解除」してからやり直してください。');
      return;
    }
    selectedSeats.set(sid,{blk:blk,num:selSeat.num,sid:sid,mode:'cancel'});
    updateSelBar();
    closeModal();
    renderMap();
  }
}

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  selSeat = null;
}

// ─────────────────────────────────────────────
//  保存
// ─────────────────────────────────────────────
async function bulkPgReturn(){
  var targets=[];
  selectedSeats.forEach(function(v){if(v.mode==='pg-return')targets.push(v);});
  if(targets.length===0) return;
  if(!confirm(targets.length+'席のPG配分を返却済みに変更しますか？')) return;
  showLoad(targets.length+'席を返却済みに変更中ばい...');
  try{
    var READONLY_R=['Author','Editor','Created','Modified','ID','GUID','ContentType'];
    function setR2(f,k,v){var n=colMap[k]||k;if(READONLY_R.indexOf(n)<0)f[n]=v;}
    for(var i=0;i<targets.length;i++){
      var t=targets[i];
      var f={Title:showId+'-'+t.sid};
      setR2(f,'公演ID',showId); setR2(f,'座席ID',t.sid);
      setR2(f,'購入者名','返却済'); setR2(f,'電話番号','');
      setR2(f,'席種',getSeatType(t.blk)); setR2(f,'受付','システム');
      if(soldMap[t.sid]&&soldMap[t.sid].itemId){
        await graph(LIST_URL+'/items/'+soldMap[t.sid].itemId,'PATCH',{fields:f});
      } else {
        await graph(LIST_URL+'/items','POST',{fields:f});
      }
    }
    selectedSeats.clear();
    document.body.classList.remove('sel-open');
    updateSelBar();
    await loadSeatData();
  }catch(e){alert('エラー: '+e.message);}
  finally{hideLoad();}
}

async function cancelSelected(){
  var targets=[];
  selectedSeats.forEach(function(v){if(v.mode==='cancel')targets.push(v);});
  if(targets.length===0) return;
  if(!confirm(targets.length+'席の予約・配分を取り消しますか？')) return;
  showLoad(targets.length+'席を取り消し中...');
  try{
    var READONLY2=['Author','Editor','Created','Modified','ID','GUID','ContentType'];
    function setC(f,k,v){var n=colMap[k]||k;if(READONLY2.indexOf(n)<0)f[n]=v;}
    for(var i=0;i<targets.length;i++){
      var t=targets[i];
      if(soldMap[t.sid]&&soldMap[t.sid].itemId){
        var cf={Title:showId+'-'+t.sid};
        if(t.blk.role==='pg'){
          // PG席はDELETEせず返却済みに戻す（プレイガイド在庫に復帰）
          setC(cf,'購入者名','返却済'); setC(cf,'電話番号','');
          setC(cf,'受付','システム');
        } else {
          // KTN席はDELETEせずキャンセル済に更新（Power Automateで取消ログを記録）
          setC(cf,'購入者名','キャンセル済'); setC(cf,'電話番号','');
          setC(cf,'受付','システム');
        }
        await graph(LIST_URL+'/items/'+soldMap[t.sid].itemId,'PATCH',{fields:cf});
      }
    }
    selectedSeats.clear();
    document.body.classList.remove('sel-open');
    updateSelBar();
    await loadSeatData();
  }catch(e){
    alert('取り消しエラー: '+e.message);
  }finally{
    hideLoad();
  }
}

async function saveSeat(){
  var name   = document.getElementById('inp-name').value.trim();
  var tel    = document.getElementById('inp-tel').value.trim();
  var staffEl = document.getElementById('sel-staff');
  var staffV = staffEl.value;
  var memoEl = document.getElementById('inp-memo');
  var memoV  = memoEl ? memoEl.value.trim() : '';
  var err    = document.getElementById('err-msg');
  err.textContent='';
  if(!name){err.textContent='購入者名を入力してください';return;}
  if(!tel) {err.textContent='電話番号を入力してください';return;}
  if(!staffV){err.textContent='受付を選択してください';return;}

  // 対象座席リスト
  var targets = [];
  if(selectedSeats.size>0){
    selectedSeats.forEach(function(v){targets.push(v);});
  } else if(selSeat){
    targets.push(selSeat);
  }
  if(targets.length===0) return;

  // 二重チェック
  var dups = [];
  for(var i=0;i<targets.length;i++){
    var _info=soldMap[targets[i].sid];
    if(_info && _info.name!=='返却済' && _info.name!=='キャンセル済') dups.push(targets[i].sid);
  }
  if(dups.length>0){
    err.textContent=dups.join('、')+' はすでに予約済みです。更新してご確認ください。';
    return;
  }

  document.getElementById('btn-save').disabled=true;
  showLoad(targets.length+'席を登録中...');
  try{
    var READONLY=['Author','Editor','Created','Modified','ID','GUID','ContentType'];
    for(var i=0;i<targets.length;i++){
      var t = targets[i];
      var f = {Title: showId+'-'+t.sid};
      var useName  = name;
      var useTel   = tel;
      var useStaff = staffV;
      // PG席は入力値をそのまま使用（デフォルトがPG_CONFIGだが変更可能）
      function setF(fields,key,val){
        var internal = colMap[key]||key;
        if(READONLY.indexOf(internal)<0) fields[internal]=val;
      }
      setF(f,'公演ID', showId);
      setF(f,'座席ID', t.sid);
      setF(f,'購入者名', useName);
      setF(f,'電話番号', useTel);
      setF(f,'席種', getSeatType(t.blk));
      setF(f,'受付', useStaff);
      setF(f,'メモ', memoV);
      // 返却済・キャンセル済の席はPATCHで上書き（重複防止）
      if(soldMap[t.sid] && (soldMap[t.sid].name==='返却済' || soldMap[t.sid].name==='キャンセル済')){
        await graph(LIST_URL+'/items/'+soldMap[t.sid].itemId,'PATCH',{fields:f});
      } else {
        await graph(LIST_URL+'/items','POST',{fields:f});
      }
    }
    selectedSeats.clear();
    closeModal();
    await loadSeatData();
  }catch(e){
    err.textContent='登録エラー: '+e.message;
  }finally{
    document.getElementById('btn-save').disabled=false;
    hideLoad();
  }
}

async function deleteSeat(){
  if(!selSeat||!soldMap[selSeat.sid]) return;
  if(!confirm(selSeat.sid+' の予約を取り消しますか？')) return;
  showLoad('取り消し中...');
  try{
    var READONLY3=['Author','Editor','Created','Modified','ID','GUID','ContentType'];
    function setD(f,k,v){var n=colMap[k]||k;if(READONLY3.indexOf(n)<0)f[n]=v;}
    var df={Title:showId+'-'+selSeat.sid};
    if(selSeat.blk.role==='pg'){
      // PG席はDELETEせず返却済みに戻す（プレイガイド在庫に復帰）
      setD(df,'購入者名','返却済'); setD(df,'電話番号','');
    } else {
      // KTN席はDELETEせずキャンセル済に更新（Power Automateで取消ログを記録）
      setD(df,'購入者名','キャンセル済'); setD(df,'電話番号','');
    }
    setD(df,'受付','システム');
    await graph(LIST_URL+'/items/'+soldMap[selSeat.sid].itemId,'PATCH',{fields:df});
    closeModal();
    await loadSeatData();
  }catch(e){
    alert('エラー: '+e.message);
  }finally{
    hideLoad();
  }
}

// ─────────────────────────────────────────────
//  タブ切替
// ─────────────────────────────────────────────
function switchTab(tab){
  var btns = document.querySelectorAll('.tab-btn');
  for(var i=0;i<btns.length;i++) btns[i].classList.remove('active');
  if(tab==='map'){
    btns[0].classList.add('active');
    document.getElementById('seat-map-panel').style.display='block';
    document.getElementById('search-panel').style.display='none';
    if(selectedSeats.size>0) document.getElementById('sel-bar').classList.add('open');
  } else {
    btns[1].classList.add('active');
    document.getElementById('seat-map-panel').style.display='none';
    document.getElementById('search-panel').style.display='block';
    document.getElementById('sel-bar').classList.remove('open');
    setTimeout(function(){document.getElementById('q-name').focus();},100);
  }
}

// ─────────────────────────────────────────────
//  検索
// ─────────────────────────────────────────────
async function doSearch(){
  var qName = document.getElementById('q-name').value.trim();
  var qTel  = document.getElementById('q-tel').value.trim();
  var wrap  = document.getElementById('search-results-wrap');
  if(!qName&&!qTel){wrap.innerHTML='<div class="s-results"><div class="no-r">購入者名または電話番号を入力してください</div></div>';return;}
  wrap.innerHTML='<div class="s-results"><div class="no-r">検索中ばい...</div></div>';
  try{
    var nf = colMap['購入者名']||'購入者名';
    var tf = colMap['電話番号'] ||'電話番号';
    var qnL = qName.toLowerCase();
    var qtL = qTel.toLowerCase();
    // 全件取得してクライアント側でフィルタ（contains検索）
    showLoad('全件取得中ばい...まっとって...');
    var allItems=[];
    var nextUrl=LIST_URL+'/items?$expand=fields&$top=500';
    while(nextUrl){
      var pageRes=await graph(nextUrl);
      allItems=allItems.concat(pageRes.value);
      nextUrl=pageRes['@odata.nextLink']||null;
    }
    var res = {value: allItems.filter(function(item){
      var f=item.fields;
      var nm=(f[nf]||'').toLowerCase();
      var tl=(f[tf]||'').toLowerCase();
      return (!qnL||nm.includes(qnL))&&(!qtL||tl.includes(qtL));
    })};
    if(!res.value||res.value.length===0){
      wrap.innerHTML='<div class="s-results"><div class="no-r">該当する予約が見つかりませんでした</div></div>';
      return;
    }
    var showMap={};
    for(var i=0;i<SHOWS.length;i++) showMap[SHOWS[i].id]=SHOWS[i].label;
    var rows='';
    for(var i=0;i<res.value.length;i++){
      var f=res.value[i].fields;
      var sid   = f[colMap['座席ID']  ||'座席ID']  ||'';
      var nm    = f[colMap['購入者名']||'購入者名']||'';
      var tel2  = f[colMap['電話番号']||'電話番号']||'';
      var stype = f[colMap['席種']    ||'席種']    ||'';
      var stf   = f[colMap['受付']    ||'受付']    ||'';
      var memo2 = f[colMap['メモ']    ||'メモ']    ||'';
      var pid   = f[colMap['公演ID']  ||'公演ID']  ||'';
      var sl    = showMap[pid]||pid;
      var isPg  = (nm===PG_CONFIG.buyerName);
      var bdg   = stype==='SS席'?'bdg-ss':stype==='S席'?'bdg-s':stype==='BOX席'?'bdg-bx':'bdg-pg';
      if(isPg) bdg='bdg-pg';
      rows+='<tr><td>'+escapeHtml(sl)+'</td>'
        +'<td><span class="'+bdg+'">'+escapeHtml(isPg?'PG':stype)+'</span></td>'
        +'<td><strong>'+escapeHtml(sid)+'</strong></td>'
        +'<td>'+escapeHtml(nm)+'</td><td>'+escapeHtml(tel2)+'</td><td>'+escapeHtml(stf)+'</td>'
        +'<td>'+escapeHtml(memo2)+'</td></tr>';
    }
    wrap.innerHTML='<div class="s-results"><table>'
      +'<thead><tr><th>公演日</th><th>席種</th><th>座席ID</th><th>購入者名</th><th>電話番号</th><th>受付</th><th>メモ</th></tr></thead>'
      +'<tbody>'+rows+'</tbody></table></div>'
      +'<p style="margin-top:10px;font-size:.82rem;color:#888;padding:0 4px">'+res.value.length+'件見つかりました</p>';
  }catch(e){
    wrap.innerHTML='<div class="s-results"><div class="no-r">検索エラー: '+escapeHtml(e.message)+'</div></div>';
  }finally{
    hideLoad();
  }
}

// ─────────────────────────────────────────────
//  ユーティリティ
// ─────────────────────────────────────────────
function showLoad(msg){
  var el=document.getElementById('loading');
  el.textContent=msg||'読み込みよるばい...';
  el.style.display='block';
}
function hideLoad(){document.getElementById('loading').style.display='none';}

document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
document.getElementById('modal-overlay').addEventListener('click',function(e){
  if(e.target.id==='modal-overlay') closeModal();
});

// ─────────────────────────────────────────────
//  起動（自動ログイン確認）
// ─────────────────────────────────────────────
window.addEventListener('load',function(){
  getMsal().then(function(inst){
    return inst.handleRedirectPromise().then(function(r){
      if(r){account=r.account;onLoggedIn();return;}
      var acc=inst.getAllAccounts();
      if(acc.length>0){account=acc[0];onLoggedIn();}
    }).catch(function(e){console.warn(e);});
  }).catch(function(e){console.warn('MSAL init:',e.message);});
});
